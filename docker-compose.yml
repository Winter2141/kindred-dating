services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kindred
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kindred}
      POSTGRES_DB: kindred
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindred -d kindred"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      KINDRED_SECRET_KEY: ${KINDRED_SECRET_KEY:-change-me-to-a-long-random-string}
      KINDRED_DATABASE_URL: postgresql+asyncpg://kindred:${POSTGRES_PASSWORD:-kindred}@postgres:5432/kindred
      KINDRED_REDIS_URL: redis://redis:6379/0
      KINDRED_DEMO_MODE: "true"
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
  media:
